services:
  minimax-music-ui:
    build: .
    image: minimax-music-ui
    container_name: minimax-music-ui
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # Optional. When set, these lock the corresponding fields in Settings.
      MUSIC_API: ${MUSIC_API:-}
      MUSIC_API_KEY: ${MUSIC_API_KEY:-}
      # Optional. Use a random value of at least 32 characters to require API auth.
      UI_TOKEN: ${UI_TOKEN:-}
    restart: unless-stopped
